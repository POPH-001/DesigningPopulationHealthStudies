<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 450" width="620" height="450" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<rect width="620" height="450" fill="#FFFFFF"/>
<defs>
<marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#008080"/></marker>
<marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker>
<marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker>
</defs>
<text x="120" y="28" font-size="16" font-weight="700" font-style="normal" fill="#6B7280" text-anchor="middle">At baseline</text>
<text x="500" y="28" font-size="16" font-weight="700" font-style="normal" fill="#6B7280" text-anchor="middle">Follow-up</text>
<rect x="10" y="60" width="220" height="90" rx="10" fill="#F6E7E7" stroke="#7F1D1D" stroke-width="2"/>
<text x="120.0" y="100.44" font-size="17" font-weight="700" font-style="normal" fill="#1F2937" text-anchor="middle">Exposed (E₁)</text>
<text x="120.0" y="120.98" font-size="14" font-weight="400" font-style="italic" fill="#1F2937" text-anchor="middle">free of disease at start</text>
<rect x="10" y="230" width="220" height="90" rx="10" fill="#E3EFF4" stroke="#1F6F8B" stroke-width="2"/>
<text x="120.0" y="270.44" font-size="17" font-weight="700" font-style="normal" fill="#1F2937" text-anchor="middle">Unexposed (E₀)</text>
<text x="120.0" y="290.98" font-size="14" font-weight="400" font-style="italic" fill="#1F2937" text-anchor="middle">free of disease at start</text>
<rect x="390" y="45" width="220" height="46" rx="10" fill="#374151" stroke="#374151" stroke-width="2"/>
<text x="500.0" y="72.8" font-size="15" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">Develop disease (D₁)</text>
<rect x="390" y="103" width="220" height="46" rx="10" fill="#FFFFFF" stroke="#374151" stroke-width="2"/>
<text x="500.0" y="130.8" font-size="15" font-weight="600" font-style="normal" fill="#1F2937" text-anchor="middle">Remain free (D₀)</text>
<line x1="232" y1="105" x2="387" y2="68" stroke="#008080" stroke-width="2.5" marker-end="url(#ah-teal)"/>
<line x1="232" y1="105" x2="387" y2="126" stroke="#008080" stroke-width="2.5" marker-end="url(#ah-teal)"/>
<rect x="390" y="215" width="220" height="46" rx="10" fill="#374151" stroke="#374151" stroke-width="2"/>
<text x="500.0" y="242.8" font-size="15" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">Develop disease (D₁)</text>
<rect x="390" y="273" width="220" height="46" rx="10" fill="#FFFFFF" stroke="#374151" stroke-width="2"/>
<text x="500.0" y="300.8" font-size="15" font-weight="600" font-style="normal" fill="#1F2937" text-anchor="middle">Remain free (D₀)</text>
<line x1="232" y1="275" x2="387" y2="238" stroke="#008080" stroke-width="2.5" marker-end="url(#ah-teal)"/>
<line x1="232" y1="275" x2="387" y2="296" stroke="#008080" stroke-width="2.5" marker-end="url(#ah-teal)"/>
<text x="310" y="196" font-size="15" font-weight="700" font-style="italic" fill="#008080" text-anchor="middle">Follow both groups forward</text>
<line x1="10" y1="375" x2="610" y2="375" stroke="#6B7280" stroke-width="2" marker-end="url(#ah-grey)"/>
<text x="610" y="365" font-size="15" font-weight="600" font-style="normal" fill="#6B7280" text-anchor="end">Time</text>
<line x1="120" y1="367" x2="120" y2="383" stroke="#6B7280" stroke-width="2"/>
<line x1="500" y1="367" x2="500" y2="383" stroke="#6B7280" stroke-width="2"/>
<path d="M120,379 l-8,14 h16 z" fill="#008080"/>
<text x="120" y="413" font-size="15" font-weight="600" font-style="normal" fill="#008080" text-anchor="middle">Prospective cohort</text>
<text x="120" y="432" font-size="15" font-weight="400" font-style="normal" fill="#6B7280" text-anchor="middle">starts here, follows forward</text>
<path d="M500,379 l-8,14 h16 z" fill="#008080"/>
<text x="500" y="413" font-size="15" font-weight="600" font-style="normal" fill="#008080" text-anchor="middle">Retrospective cohort</text>
<text x="500" y="432" font-size="15" font-weight="400" font-style="normal" fill="#6B7280" text-anchor="middle">starts here, uses records</text>
</svg>
